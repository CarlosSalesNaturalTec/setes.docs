name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# Path filters por app + drift check dos tipos (task 10.2).
# pull-requests:read é exigido pelo dorny/paths-filter para consultar a API
# de arquivos alterados em eventos pull_request (o default do token no repo
# é restritivo: só contents/metadata/packages).
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/api-types/**'
              - 'scripts/gen-types.mjs'
            web:
              - 'apps/web/**'
              - 'packages/api-types/**'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync deps
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @setes/web typecheck
      - name: Test
        run: pnpm --filter @setes/web test

  types-drift:
    # Garante que packages/api-types está em dia com o contrato do FastAPI.
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync api deps (para exportar o OpenAPI)
        working-directory: apps/api
        run: uv sync
      - name: Drift check dos tipos gerados
        run: pnpm gen:types:check
