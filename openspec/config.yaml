schema: spec-driven

context: |
  Projeto: SETES.DOCS — sistema de gestão de processos administrativos com
  tramitação manual, sigilo, gestão documental e consulta pública.
  Cliente: instituição privada (correção registrada no change
  migracao-regiao-us-central1, D6 — a premissa anterior de órgão público estava
  incorreta). A LGPD (Lei 13.709/2018) permanece obrigatória integralmente; a
  natureza privada do controlador muda apenas a análise de transferência
  internacional de dados (ver docs/lgpd-transferencia-internacional-us-central1.md),
  não a aplicabilidade da lei.

  Ajustes pós-avaliação do cliente (docs/Ajustes SETES DOCS.pdf) — seis changes
  arquivados entre 2026-07-31 e 2026-08-03. Removido do produto, NÃO reintroduzir
  sem decisão explícita:
    - Roteiro / tramitação automática por tipo de processo (change tramitacao-manual,
      migration 0024_remover_roteiro). Tramitação é manual: o servidor escolhe
      unidade, setor, servidor de destino e mensagem a cada passo. Os eventos são
      envio (ex-`despacho`), reatribuicao, devolucao e conclusao.
    - Kanban por unidade inteira (change kanban-por-servidor): o quadro do Servidor é
      pessoal (criados por ele ou direcionados a ele); Gestor vê as unidades sob sua
      gestão. Arquivados ocultos por padrão, exibidos por checkbox.
    - Formulário inline de cadastro de usuário no index (change
      setores-e-cadastro-usuario): virou modal; o espaço virou filtro por nome.
  Acrescentado: Setor (2º nível da estrutura, 1:N com Unidade — NÃO é fronteira de
  permissão, o escopo de acesso continua sendo a Unidade); campos de usuário
  telefone/cargo/chefia_direta/setor_id; catálogo de ModeloDocumento com lacunas
  preenchidas na abertura do processo; "Meu Perfil" em abas.

  Assinatura digital (Épico 4 do PRD) foi RETOMADA na Fase 2 — decisão formalizada
  em 2026-11-09 (change retomada-epico-assinatura), aprovada por Ademilton Leal
  Coutinho, Diretor Presidente (resposta A5). Fonte: respostas da SETES de 2026-10-13
  e devolutiva, transcritas em docs/fase2-assinatura/respostas-cliente.md. Caminho
  determinado: QUALIFICADO (ICP-Brasil, certificado em nuvem autorizado no aplicativo
  do PSC — nunca token/smart card, nunca PIN coletado pelo sistema), por força de A1.
  MP 2.200-2/2001 e as normas ICP-Brasil (incl. DOC-ICP-15 e DOC-ICP-17.01) são
  conformidade obrigatória em toda change de assinatura. Leia o README.md de
  docs/fase2-assinatura/ antes de qualquer trabalho de assinatura.
  Escopo recortado pelo cliente (PRD, Épico 4): só documentos gerados por
  ModeloDocumento, em PDF (B1); só pessoa física, sem e-CNPJ (B5); só assina quem
  está com o processo (B6); consulta pública sem documentos nem assinaturas (G1);
  sem assinatura retroativa (H3); documentos de registro público ficam fora do
  Despapelize (A3 + devolutiva). Carimbo de tempo: SIM (devolutiva) — alvo PAdES AD-RT.
  Retomar o épico NÃO libera todas as changes. Bloqueios por change (cada um aponta
  para docs/fase2-assinatura/respostas-cliente.md, "Pendências"; ao arquivar uma
  change de assinatura, retire daqui a linha dela):
    - assinatura-qualificada-psc: BLOQUEADA até (a) contratação da Soluti concluída
      com credencial/certificado SSL da instituição emitidos (D4, pendência 8);
      (b) tabela de prazos de guarda recebida (F2, pendência 5); (c) F1 ratificada
      pelo DPO ou declarada competência da diretoria (pendência 4); (d) plano para
      quem não tiver certificado (D2, pendência 6) e política interna (H4,
      pendência 7).
    - assinatura-coassinatura (B3) e assinatura-perfil-assinados: dependem de
      assinatura-qualificada-psc arquivada.
    - assinatura-carimbo-tempo: decisão tomada (sim); depende de
      assinatura-qualificada-psc e da contratação da Autoridade de Carimbo do Tempo.
    - assinatura-avancada (modelo misto, A4): NÃO PLANEJADA — recomendação técnica,
      não decisão do cliente: com B4 ≈ 10 signatários (devolutiva) o modelo misto não
      economiza certificados e exigiria um segundo caminho de assinatura no código.
      Não proponha sem nova decisão da SETES.
  Arquivada: assinatura-verificacao-fundacao (2026-11-10) — capability
  `verificacao-assinatura` (verificar assinaturas de PDFs anexados, US 4.2/G3; âncoras
  ICP-Brasil em apps/api/app/trust/icp_brasil/, flag dev DEV_TRUST_ANCHOR_TESTE, spec
  Playwright 20). Seu gate de conformidade manual (PDFs reais × VALIDAR do ITI,
  conformidade.md da change arquivada) segue PENDENTE — fazer antes de divulgar a
  funcionalidade. ASSINAR documentos ainda não existe: `documentos_assinados` no
  perfil continua placeholder vazio.
  Nome da instituição para contrato e texto exibido ao usuário: INSTITUTO SETES
  (devolutiva, 4c).

  Stack:
    Frontend: Next.js 15 (TypeScript, App Router), Tailwind
    Backend: Python 3.12, FastAPI, SQLAlchemy 2.x + Alembic (migrations)
    Banco: PostgreSQL (Cloud SQL)
    Infra: GCP em região única us-central1 (escolha de custo pedida pelo cliente,
      não residência de dados — change migracao-regiao-us-central1; nenhum recurso
      deve fixar região literal, sempre var.region) —
      Cloud Run (front e back), Cloud Storage (documentos anexados),
      Secret Manager (db-password, jwt-signing-key, sendgrid-api-key), Cloud
      Scheduler + Cloud Run Jobs (arquivamento automático, manutenção diária,
      anonimização LGPD trimestral), Cloud Tasks (fila `emails`, envio assíncrono)
    Autenticação: própria (login/senha), JWT HS256, sem SSO externo no MVP
    Contrato frontend-backend: OpenAPI gerado pelo FastAPI, tipos TS gerados
      via openapi-typescript em packages/api-types (commitados; CI falha em drift)

  Linguagem de código: português brasileiro para nomes de entidades e regras
  de negócio (Processo, Unidade, Setor, Tramitação, Modelo de Documento), inglês para
  termos técnicos genéricos de infraestrutura (Repository, Service, Router).
  Comentários e docstrings em português.

  Padrão de branches: feature/<nome-do-change>, main (GitHub Flow — sem staging; validação pré-produção via traffic splitting do Cloud Run, não via branch)
  Merge: --no-ff obrigatório
  Changes arquivados em openspec/changes/archive/, nomeados YYYY-MM-DD-<slug>.
  Testes: pytest (FastAPI — contra Postgres real, sem mocks/sqlite; a fixture `db`
    trunca o banco após cada teste, então a suíte não é paralelizável), Vitest +
    React Testing Library (Next.js, testes colocados junto ao código), Playwright
    para fluxos críticos (login, tramitação, documentos, consulta pública)

  Decisões de design são numeradas (D1, D2, …) no design.md de cada change e
  citadas em comentários/docstrings do código — a numeração é local ao change.
  Ao implementar, mantenha a citação; ao ler um `(Dx)`, busque o design.md de origem.

  Conformidade obrigatória em todo change que toque dados pessoais ou
  documentos: LGPD (Lei 13.709/2018). Histórico de tramitação é imutável — nunca
  modelar como UPDATE, sempre como INSERT de novo evento.

rules:
  proposal:
    - 'Indicar de qual change anterior este depende (ex.: "requer identidade-e-estrutura-organizacional arquivado")'
    - Identificar tabelas PostgreSQL novas ou afetadas, com FKs relevantes
    - Indicar se o change exige novo segredo no Secret Manager ou novo bucket no Cloud Storage
    - Se envolver dados pessoais (CPF/CNPJ, nome de interessado), declarar explicitamente o tratamento LGPD (coleta, retenção, anonimização)

  specs:
    - Usar formato Dado/Quando/Então para todos os cenários, no mesmo padrão
      do PRD original (evitar reescrever critérios de aceite já definidos —
      referenciar a US correspondente do PRD quando existir)
    - Estados e transições de processo (Aberto, Em Tramitação, Concluído,
      Arquivado) devem ser modelados como máquina de estados explícita, nunca
      como campo de texto livre
    - Toda regra de visibilidade por unidade/perfil deve ter cenário de
      "acesso negado" explícito, não só o caminho feliz

  design:
    - Incluir diagrama de sequência para fluxos com 3+ etapas ou que
      atravessem front, back e job assíncrono
    - Para rotinas automáticas (Cloud Scheduler / Cloud Run Jobs), documentar
      gatilho, janela de execução e comportamento de retomada após falha
      (idempotência)
    - Para endpoints públicos (consulta pública, canal LGPD), documentar
      explicitamente rate limiting e ausência de autenticação
    - Migrations Alembic descritas separadamente do design de API (schema
      antes de endpoint). Revisions usam IDs sequenciais escritos à mão
      (NNNN_<slug>, down_revision = a anterior), nunca hash de --autogenerate
    - Numerar as decisões como D1, D2, … — são o alvo das citações `(Dx)` no código

  tasks:
    - Tarefas atômicas (máximo 2h cada), com critério de aceite por tarefa
    - Separar tarefas de migration/schema das tarefas de endpoint/UI
    - Toda tarefa que toque histórico de tramitação ou dados pessoais deve
      incluir tarefa de teste automatizado correspondente (não é opcional)
    - Toda tarefa que implemente ou altere login, tramitação, documentos ou
      consulta pública deve incluir tarefa de teste E2E via Playwright
      correspondente (não é opcional)
    - Toda tarefa que mude rota ou schema do FastAPI deve incluir tarefa de
      `pnpm gen:types` + commit de packages/api-types — o CI falha no job de
      drift caso contrário
    - >-
      Toda change que altere uma tela, um fluxo de usuário final ou o texto
      exibido ao usuário deve incluir tarefa de atualizar `docs/manual/**`
      (não é opcional). Dispara em: tela nova ou removida, passo a passo
      alterado, campo/botão/menu alterado, texto exibido ao usuário, regra de
      negócio que muda o que o usuário pode fazer, perfil que ganha ou perde
      acesso. NÃO dispara em: refatoração sem efeito visível, correção de bug
      que restaura comportamento já documentado, migration/schema interno,
      infraestrutura, CI, Terraform, mudança de teste, performance sem
      mudança de UI. O critério de aceite da tarefa é a execução de
      `mkdocs build --strict` local — não basta afirmar que o manual foi
      atualizado
